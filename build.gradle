plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.coordination'
version = '0.1.0-SNAPSHOT'
description = 'Модуль «Согласование» — координация процессов согласования (coordination-processing-module)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// ADR-028: явная фиксация версии Hibernate 7.4.0 поверх управляемой Spring Boot 4.0.3 BOM.
// Ключ свойства ('hibernate.version') соответствует конвенции Spring Boot dependency-management
// для версий 3.x/4.x; при обновлении Boot-плагина сверить с фактическим списком managed-версий.
ext['hibernate.version'] = '7.4.0.Final'

dependencyManagement {
    imports {
        // ADR-028: Spring Cloud 2025.1.1 ("Oakwood") — release train, совместимый с Spring Boot 4.0.x
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.1"
        mavenBom "org.testcontainers:testcontainers-bom:1.21.4"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // OpenAPI/Swagger документация REST API
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Миграции схемы БД (08_db_schema.md §27). С Spring Boot 4.0 автоконфигурация Flyway
    // вынесена в отдельный модуль (org.springframework.boot.flyway.autoconfigure), не
    // включённый транзитивно ни одним из уже подключённых starter'ов.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Распределённые блокировки планировщика (08_db_schema.md §18, ADR-013)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.3.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.3.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4.0: spring-boot-starter-test больше не тянет web-срез тестов и TestRestTemplate —
    // @WebMvcTest/MockMvc вынесены в spring-boot-webmvc-test, TestRestTemplate — в
    // spring-boot-resttestclient (см. ADR-029 в doc/arch/11_adr.md).
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    // TestRestTemplate из spring-boot-resttestclient зависит от ClientHttpRequestFactoryBuilder
    // (модуль spring-boot-http-client) и RestTemplateBuilder (spring-boot-restclient) —
    // эти модули не приходят транзитивно.
    testImplementation 'org.springframework.boot:spring-boot-http-client'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:rabbitmq'
    // Драйвер jdbc:tc: для application-test.yml (profile "test") — см. src/main/resources/application.yml
    testImplementation 'org.testcontainers:jdbc'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Обязательная компиляция тестового кода.
//
// Мотивация (аудит 2026-10-06): пять тестовых классов были закоммичены без компиляции —
// они ссылались на несуществующие сервисы, удалённые в Spring Boot 4.0 аннотации
// (@WebMvcTest/@MockBean) и методы доменных билдеров, которых нет. `./gradlew build` падал
// на :compileTestJava, то есть тесты не запускались вообще, а README при этом заявлял
// зелёную сборку. Задача ниже выносит компиляцию тестов в отдельный адресуемый шаг, который
// можно запускать в CI за секунды, без поднятия Docker и Testcontainers:
//
//     ./gradlew compileTestJava
//
// Сам :compileTestJava уже является зависимостью :test, поэтому отдельного «enforcement»
// здесь не требуется — важно, что теперь это документированная и проверяемая точка.
tasks.register('verifyTestCompilation') {
    group = 'verification'
    description = 'Компилирует main и test без запуска тестов (быстрая проверка в CI, не требует Docker).'
    dependsOn tasks.named('compileTestJava')
}

# Локальное окружение для разработки/Фазы 1.
# Postgres публикуется на хосте как 5433: порт 5432 занят нативным PostgreSQL (служба
# postgresql-x64-18), и подключения к localhost:5432 уходят в него, а не в контейнер.
# Параметры для внешних клиентов (DBeaver, psql, приложение вне Docker):
#   host=localhost, port=5433, database=coordination, user=coordination, password=coordination
#   DB_URL=jdbc:postgresql://localhost:5433/coordination
# Внутри docker-сети приложение по-прежнему ходит на postgres:5432.
# RabbitMQ доступен на localhost:5672 (AMQP) и localhost:15672 (UI).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coordination
      POSTGRES_USER: coordination
      POSTGRES_PASSWORD: coordination
    ports:
      # Наружу — 5433, чтобы не конфликтовать с нативным PostgreSQL 18 на 5432.
      - "5433:5432"
    volumes:
      - coordination-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordination"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ssm-processing-service:local
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/coordination
      DB_USERNAME: coordination
      DB_PASSWORD: coordination
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  coordination-postgres-data:

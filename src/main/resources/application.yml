spring:
  application:
    name: coordination-processing-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coordination}
    username: ${DB_USERNAME:coordination}
    password: ${DB_PASSWORD:coordination}
    hikari:
      pool-name: coordination-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Схемой владеет Flyway (08_db_schema.md §27) — Hibernate только валидирует соответствие.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Outbox — единственный писатель в RabbitMQ (08_db_schema.md §19, 10_architecture.md).
    listener:
      simple:
        acknowledge-mode: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    ru.coordination.approval: INFO

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///coordination_test
